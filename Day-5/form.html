<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learing forms</title>
</head>
<body>
 <form action="/register" method="post">
    <label for="name">Name:</label>
    <input type="text" placeholder="Your name" id="name" name="name" value="Niggah" required minlength="3" maxlength="50">
    <br>
    <label for="email">Email:</label>
    <input type="email" placeholder="Your Email" id="email" name="email" value="@gmail.com" required minlength="5" maxlength="100">
    <br>
    <label for="age">Age:</label>
    <input type="number" placeholder="Your Age" id="age" name="age" required min="1" max="100">
    <br>
    <label for="dob">DOB: </label>
    <input type="date" placeholder="Date Of Birth" id="dob" name="dob" required> 
    <br>
    <label for="colour">Favourite Colour: </label>
    <input type="color" id="colour" name="colour">
    <br>
    <label for="gender1">Male</label>
    <input type="radio" id="gender1" name="gender">
    <br>
    <label for="gender2">Female</label>
    <input type="radio" id="gender2" name="gender">
    
    
    <br>

    <button type="submit">Submit</button>
    <button type="reset">Reset</button>

 </form>   
</body>
</html>
